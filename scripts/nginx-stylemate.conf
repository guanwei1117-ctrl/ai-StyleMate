# StyleMate Nginx 反向代理配置
#
# 适用场景：单域名（如 style.example.com）同时托管前端 + 后端 API
#
# 安装方法：
#   sudo cp scripts/nginx-stylemate.conf /etc/nginx/sites-available/stylemate
#   sudo ln -s /etc/nginx/sites-available/stylemate /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 申请 HTTPS 证书：
#   sudo certbot --nginx -d style.example.com
#
# 注意：把下面两处 style.example.com 替换成你的真实域名

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name style.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS 反代
server {
    listen 443 ssl http2;
    server_name style.example.com;

    # SSL 证书路径（certbot 自动续期）
    ssl_certificate     /etc/letsencrypt/live/style.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/style.example.com/privkey.pem;

    # 安全 headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 上传图片大小（AI 评分照片可能较大）
    client_max_body_size 20m;

    # 前端（Next.js）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式 AI 响应 / WebSocket 需要
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}