# ============================================================
# StyleMate 生产 Nginx 配置
#
# 用法：
#   1. 复制本文件到 /etc/nginx/conf.d/stylemate.conf
#   2. 把 stylemate.example.com 换成你的域名（或先用服务器 IP 测试）
#   3. nginx -t && systemctl reload nginx
#
# 结构：
#   80/443 → 前端 Next.js (127.0.0.1:3000)
#   /api/v1/* → 后端 NestJS (127.0.0.1:4000)
# ============================================================

server {
    listen 80;
    server_name stylemate.example.com;   # TODO 改成你的域名

    # 前端页面
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 分析较慢，放宽超时
        client_max_body_size 30m;  # 两张 8MB 图片转 base64 后较大
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}

