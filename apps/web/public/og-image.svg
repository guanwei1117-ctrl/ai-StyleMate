<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B"/>
      <stop offset="100%" style="stop-color:#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg-grad)" rx="0"/>
  <!-- 装饰圆 -->
  <circle cx="1000" cy="100" r="300" fill="#8B5CF6" opacity="0.08"/>
  <circle cx="200" cy="500" r="250" fill="#EC4899" opacity="0.06"/>
  <!-- 衣架图标 -->
  <g transform="translate(80, 240)">
    <path d="M0 60 L35 15 L70 60" stroke="url(#accent)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="35" y1="15" x2="35" y2="40" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <line x1="24" y1="40" x2="46" y2="40" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- 主标题 -->
  <text x="180" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">
    StyleMate
  </text>
  <text x="180" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#C4B5FD" letter-spacing="4">
    AI · 穿搭助手
  </text>
  <!-- 描述 -->
  <text x="180" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#9CA3AF">
    从风格灵感、个人测评到每日穿搭，帮你完成从买到穿的无痛闭环
  </text>
  <!-- 功能标签 -->
  <g transform="translate(180, 440)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#8B5CF6" opacity="0.2"/>
    <text x="50" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#C4B5FD" text-anchor="middle">风格测评</text>
    <rect x="112" y="0" width="100" height="32" rx="16" fill="#EC4899" opacity="0.2"/>
    <text x="162" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F9A8D4" text-anchor="middle">穿搭诊断</text>
    <rect x="224" y="0" width="100" height="32" rx="16" fill="#8B5CF6" opacity="0.2"/>
    <text x="274" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#C4B5FD" text-anchor="middle">每日穿搭</text>
    <rect x="336" y="0" width="100" height="32" rx="16" fill="#EC4899" opacity="0.2"/>
    <text x="386" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F9A8D4" text-anchor="middle">智能衣橱</text>
  </g>
  <!-- 底部信息 -->
  <text x="180" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6B7280">
    Next.js 14 · NestJS 10 · TypeScript · PostgreSQL · Claude / OpenAI / Qwen-VL
  </text>
  <!-- 右下角装饰 -->
  <text x="1050" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4B5563">
    github.com/guanwei1117-ctrl/cleanfit
  </text>
</svg>