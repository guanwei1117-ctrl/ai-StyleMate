# GitHub Actions: 自动部署到服务器
#
# 触发条件：推送到 main 分支（也可改为 tag 触发）
# 工作流：
#   1. checkout 代码
#   2. 通过 SSH 登录服务器
#   3. 服务器侧跑 scripts/deploy.sh（git pull + build + pm2 reload + healthcheck）
#
# 服务器侧一次性配置见 docs/DEPLOY.md
#
# 所需 GitHub Secrets（在仓库 Settings → Secrets → Actions 添加）：
#   SSH_PRIVATE_KEY  部署专用 SSH 私钥（公钥已加到服务器 ~/.ssh/authorized_keys）
#   SSH_HOST          服务器 IP / 域名
#   SSH_USER          登录用户名（如 deploy）
#   DEPLOY_PATH       部署目录（如 /srv/stylemate）

name: Deploy to Server

on:
  push:
    branches:
      - main
    # 排除 README 等纯文档改动（可选）
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    # 允许在 Actions 页面手动触发

concurrency:
  group: deploy-production
  cancel-in-progress: false
  # 同一时间只允许一个部署，避免并发覆盖

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 服务器侧的部署入口（幂等脚本，含健康检查与失败回滚）
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            bash scripts/deploy.sh
          # 增加超时：build 阶段通常 2-5 分钟
          command_timeout: 10m